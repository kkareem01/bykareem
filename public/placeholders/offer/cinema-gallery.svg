<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f2f6f2"/>
  <!-- cinema screen -->
  <rect x="150" y="80" width="500" height="300" rx="18" fill="#1e3d2f"/>
  <rect x="170" y="100" width="460" height="260" rx="12" fill="#284c3b"/>
  <!-- play button -->
  <circle cx="400" cy="230" r="52" fill="#b8912e"/>
  <path d="M384 204l52 26-52 26z" fill="#fafcfa"/>
  <!-- progress bar -->
  <rect x="190" y="330" width="420" height="8" rx="4" fill="#5c7267"/>
  <rect x="190" y="330" width="150" height="8" rx="4" fill="#b8912e"/>
  <!-- gallery shelf below -->
  <g fill="#dbe3db">
    <rect x="170" y="410" width="90" height="70" rx="10"/>
    <rect x="272" y="410" width="90" height="70" rx="10"/>
    <rect x="374" y="410" width="90" height="70" rx="10"/>
    <rect x="476" y="410" width="90" height="70" rx="10"/>
  </g>
  <rect x="578" y="410" width="52" height="70" rx="10" fill="#e6eee6"/>
  <text x="80" y="560" font-family="Georgia, serif" font-size="26" fill="#5c7267" font-style="italic">Hosted for life. Shared with everyone.</text>
</svg>
