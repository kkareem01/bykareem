<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f2f6f2"/>
  <!-- stacked prompt cards -->
  <rect x="150" y="120" width="500" height="330" rx="18" fill="#dbe3db" transform="rotate(-4 400 285)"/>
  <rect x="140" y="130" width="520" height="340" rx="18" fill="#fafcfa" stroke="#dbe3db"/>
  <rect x="140" y="130" width="520" height="12" rx="6" fill="#b8912e"/>
  <text x="190" y="210" font-family="Georgia, serif" font-size="22" letter-spacing="6" fill="#b8912e">PROMPT No. 7</text>
  <text x="190" y="280" font-family="Georgia, serif" font-size="40" fill="#1e3d2f">“Look back over your</text>
  <text x="190" y="330" font-family="Georgia, serif" font-size="40" fill="#1e3d2f">shoulder — now laugh.”</text>
  <text x="190" y="410" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#5c7267">You never guess. You're directed.</text>
  <!-- camera dot -->
  <circle cx="610" cy="200" r="26" fill="#1e3d2f"/>
  <circle cx="610" cy="200" r="12" fill="#e3c878"/>
</svg>
