<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f2f6f2"/>
  <!-- phone -->
  <rect x="270" y="60" width="260" height="540" rx="36" fill="#1e3d2f"/>
  <rect x="282" y="72" width="236" height="516" rx="26" fill="#fafcfa"/>
  <rect x="360" y="84" width="80" height="10" rx="5" fill="#dbe3db"/>
