  <text x="400" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="64" fill="#1e3d2f">9:41</text>
  <!-- notification -->
  <rect x="298" y="240" width="204" height="110" rx="16" fill="#ffffff" stroke="#dbe3db"/>
  <circle cx="326" cy="272" r="14" fill="#b8912e"/>
  <text x="326" y="277" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#fafcfa">bk</text>
  <text x="348" y="270" font-family="Georgia, serif" font-size="16" fill="#1e3d2f">bykareem</text>
  <text x="348" y="290" font-family="Georgia, serif" font-size="14" fill="#5c7267">Your gallery is ready ✦</text>
  <text x="400" y="332" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#5c7267">68 photos · 72 hours later</text>
  <!-- gallery grid peek -->
  <g>
    <rect x="298" y="370" width="62" height="62" rx="8" fill="#e3c878"/>
    <rect x="369" y="370" width="62" height="62" rx="8" fill="#5c7267"/>
    <rect x="440" y="370" width="62" height="62" rx="8" fill="#1e3d2f"/>
    <rect x="298" y="441" width="62" height="62" rx="8" fill="#5c7267"/>
    <rect x="369" y="441" width="62" height="62" rx="8" fill="#1e3d2f"/>
    <rect x="440" y="441" width="62" height="62" rx="8" fill="#e3c878"/>
  </g>
</svg>
