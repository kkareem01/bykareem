<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f2f6f2"/>
  <!-- profile card -->
  <rect x="140" y="100" width="520" height="400" rx="20" fill="#fafcfa" stroke="#dbe3db"/>
  <rect x="140" y="100" width="520" height="110" rx="20" fill="#1e3d2f"/>
  <rect x="140" y="190" width="520" height="20" fill="#fafcfa"/>
  <!-- avatar with gold ring -->
  <circle cx="260" cy="210" r="78" fill="#b8912e"/>
  <circle cx="260" cy="210" r="70" fill="#e6eee6"/>
  <!-- head + shoulders silhouette -->
  <circle cx="260" cy="188" r="26" fill="#5c7267"/>
  <path d="M212 262 q48 -44 96 0 v10 h-96 z" fill="#5c7267"/>
  <!-- verified dot -->
  <circle cx="316" cy="262" r="16" fill="#b8912e"/>
  <path d="M308 262l6 6 11-12" stroke="#fafcfa" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- name + title bars -->
  <text x="180" y="340" font-family="Georgia, serif" font-size="34" fill="#1e3d2f">You, B.S. ’27</text>
  <rect x="180" y="362" width="280" height="14" rx="7" fill="#dbe3db"/>
  <rect x="180" y="388" width="200" height="14" rx="7" fill="#dbe3db"/>
  <!-- pill -->
  <rect x="180" y="428" width="190" height="40" rx="20" fill="#1e3d2f"/>
  <text x="275" y="454" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#fafcfa">Hire-ready</text>
  <text x="180" y="540" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#5c7267">The photo that matches the degree.</text>
</svg>
