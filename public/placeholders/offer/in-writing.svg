<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f2f6f2"/>
  <!-- contract page -->
  <rect x="200" y="60" width="400" height="440" rx="16" fill="#fafcfa" stroke="#dbe3db" stroke-width="4"/>
  <rect x="240" y="100" width="200" height="20" rx="10" fill="#dbe3db"/>
  <rect x="240" y="150" width="320" height="14" rx="7" fill="#e6eee6"/>
  <rect x="240" y="178" width="300" height="14" rx="7" fill="#e6eee6"/>
  <!-- highlighted delivery dates -->
  <rect x="232" y="216" width="336" height="34" rx="8" fill="#b8912e" opacity="0.25"/>
  <rect x="240" y="226" width="240" height="14" rx="7" fill="#b8912e"/>
  <rect x="232" y="262" width="336" height="34" rx="8" fill="#b8912e" opacity="0.25"/>
