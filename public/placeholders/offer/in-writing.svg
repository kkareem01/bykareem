  <circle cx="530" cy="430" r="34" fill="#b8912e"/>
  <circle cx="530" cy="430" r="24" fill="none" stroke="#fafcfa" stroke-width="3"/>
  <path d="M522 430l6 7 11-13" fill="none" stroke="#fafcfa" stroke-width="4" stroke-linecap="round"/>
  <text x="80" y="560" font-family="Georgia, serif" font-size="26" fill="#5c7267" font-style="italic">Every date in the contract. Booked means booked.</text>
</svg>
