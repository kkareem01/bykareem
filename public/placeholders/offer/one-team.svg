<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f2f6f2"/>
  <!-- shared moment: the couple -->
  <ellipse cx="400" cy="290" rx="150" ry="110" fill="#e6eee6"/>
  <g fill="#dbe3db">
    <circle cx="368" cy="250" r="26"/>
    <rect x="340" y="280" width="56" height="90" rx="24"/>
    <circle cx="438" cy="252" r="24"/>
    <rect x="414" y="280" width="50" height="88" rx="22"/>
  </g>
  <!-- photo frame, left -->
  <g>
    <rect x="90" y="130" width="230" height="300" rx="16" fill="none" stroke="#1e3d2f" stroke-width="6"/>
    <circle cx="130" cy="166" r="12" fill="#1e3d2f"/>
  </g>
  <!-- cinema frame, right -->
  <g>
    <rect x="480" y="170" width="240" height="230" rx="16" fill="none" stroke="#b8912e" stroke-width="6"/>
    <path d="M586 262l44 23-44 23z" fill="#b8912e"/>
  </g>
  <!-- one connected team line -->
  <path d="M205 460 C 320 520, 480 520, 600 430"
        fill="none" stroke="#b8912e" stroke-width="6" stroke-dasharray="2 18" stroke-linecap="round"/>
  <circle cx="205" cy="460" r="12" fill="#1e3d2f"/>
  <circle cx="600" cy="430" r="12" fill="#1e3d2f"/>
  <text x="80" y="560" font-family="Georgia, serif" font-size="26" fill="#5c7267" font-style="italic">Photo and film. One team, one story.</text>
</svg>
