  <rect x="312" y="140" width="176" height="86" rx="14" fill="#e6eee6"/>
  <circle cx="342" cy="170" r="14" fill="#b8912e"/>
  <path d="M336 170l4 5 8-9" fill="none" stroke="#fafcfa" stroke-width="3" stroke-linecap="round"/>
  <rect x="366" y="158" width="104" height="10" rx="5" fill="#dbe3db"/>
  <rect x="366" y="176" width="80" height="10" rx="5" fill="#dbe3db"/>
